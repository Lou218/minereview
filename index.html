<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineReview — Отзывы о лаунчерах Minecraft</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Подключаем стили Just Opinion -->
    <link rel="stylesheet" href="https://www.justopinion.online/comments.css">
    
    <style>
        :root {
            --bg: #121212;
            --bg-card: #1e1e2f;
            --text: #e0e0e0;
            --accent: #8a2be2;
            --accent-light: #a855f7;
            --success: #32cd32;
            --danger: #ff5555;
            --warning: #ffaa00;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #2d0b40, #4a1d6e);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--warning);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 { font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }
        header h1 span { color: var(--warning); }

        nav { display: flex; align-items: center; gap: 15px; }
        nav a { color: var(--text); text-decoration: none; font-weight: bold; transition: 0.3s; }
        nav a:hover { color: var(--accent-light); }

        .auth-buttons { display: flex; gap: 10px; align-items: center; }
        .login-btn { background: var(--accent); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .logout-btn { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .user-name { color: var(--success); font-weight: bold; font-size: 0.9rem; }

        #home-page { max-width: 1300px; margin: 40px auto; padding: 0 20px; }
        .filters { text-align: center; margin-bottom: 30px; }
        .filter-btn { background: var(--bg-card); border: 1px solid #444; color: #fff; padding: 10px 20px; margin: 5px; border-radius: 25px; cursor: pointer; transition: 0.2s; }
        .filter-btn.active { background: var(--accent); border-color: var(--accent); }

        .launcher-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .launcher-card { background: var(--bg-card); border-radius: 15px; padding: 25px; border: 1px solid #333; transition: 0.3s; cursor: pointer; display: flex; flex-direction: column; position: relative; }
        .launcher-card:hover { transform: translateY(-8px); border-color: var(--accent-light); box-shadow: 0 10px 25px rgba(138, 43, 226, 0.3); }
        
        .logo-box { width: 80px; height: 80px; margin: 0 auto 15px; border-radius: 15px; overflow: hidden; background: white; border: 2px solid #555; display: flex; align-items: center; justify-content: center; }
        .logo-box img { width: 100%; height: 100%; object-fit: contain; background: white; }
        
        .card-title { text-align: center; margin-bottom: 5px; }
        .rating-block { text-align: center; margin: 10px 0; }
        .stars-display { color: var(--warning); font-size: 1.2rem; }
        .avg-score { font-size: 1.5rem; font-weight: bold; color: var(--text); margin-top: 5px; }
        .total-votes { color: #888; font-size: 0.85rem; }
        .short-desc { color: #aaa; font-size: 0.9rem; text-align: center; margin-bottom: 15px; }
        
        .card-tag { position: absolute; top: 15px; left: 15px; padding: 5px 10px; border-radius: 5px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        .tag-license { background: var(--success); color: #000; }
        .tag-pirate { background: var(--danger); color: #fff; }
        .tag-mods { background: var(--accent); color: #fff; }

        .card-review-btn { background: var(--accent); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; margin-top: auto; }
        .card-review-btn:hover { background: var(--accent-light); }

        #detail-page { display: none; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .back-btn { background: var(--bg-card); color: var(--text); border: 1px solid #555; padding: 10px 15px; border-radius: 8px; cursor: pointer; margin-bottom: 30px; font-size: 1rem; }
        
        .detail-header { display: flex; align-items: center; gap: 30px; margin-bottom: 30px; }
        .detail-logo { width: 150px; height: 150px; background: white; border-radius: 20px; overflow: hidden; border: 3px solid var(--accent); }
        .detail-logo img { width: 100%; height: 100%; object-fit: contain; background: white; }
        .detail-title { font-size: 2.5rem; margin-bottom: 10px; }
        #detail-rating { font-size: 1.5rem; color: var(--warning); margin-bottom: 10px; }
        #detail-votes-count { color: #888; font-size: 1rem; }

        .detail-info { background: var(--bg-card); border: 1px solid #333; border-radius: 15px; padding: 25px; margin-bottom: 30px; }
        .detail-info h3 { margin-bottom: 15px; color: var(--accent-light); }
        .pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .pros, .cons { list-style: none; }
        .pros li { color: var(--success); margin-bottom: 10px; }
        .cons li { color: var(--danger); margin-bottom: 10px; }

        .reviews-section { background: var(--bg-card); border-radius: 15px; padding: 25px; border: 1px solid #333; }
        
        .star-rating { display: flex; gap: 5px; margin-bottom: 15px; justify-content: center; }
        .star-rating i { font-size: 2rem; color: #555; cursor: pointer; transition: color 0.2s; }
        .star-rating i.active { color: var(--warning); }

        .auth-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .auth-modal.active { display: flex; }
        .auth-modal-content { background: var(--bg-card); border: 2px solid var(--accent); border-radius: 15px; padding: 30px; width: 400px; max-width: 90%; text-align: center; position: relative; }
        .auth-modal-content h2 { color: var(--accent-light); margin-bottom: 20px; }
        .auth-tabs { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }
        .auth-tab { background: none; border: 1px solid #555; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .auth-tab.active { background: var(--accent); border-color: var(--accent); }
        .auth-input { margin-bottom: 15px; }
        .auth-input input { width: 100%; background: #1a1a2e; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; }
        .auth-submit { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .auth-error { color: var(--danger); margin-top: 10px; font-size: 0.9rem; }
        .close-auth { position: absolute; top: 15px; right: 15px; font-size: 24px; cursor: pointer; color: #fff; }
        
        footer { background: #0a0a0a; text-align: center; padding: 30px; margin-top: 60px; border-top: 1px solid #222; }
        footer p { color: #666; font-size: 0.9rem; }

        @media (max-width: 768px) {
            .pros-cons { grid-template-columns: 1fr; }
            .detail-header { flex-direction: column; text-align: center; }
            nav a { margin-left: 10px; font-size: 0.9rem; }
            header { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>⛏️ Mine<span>Review</span></h1>
        <nav>
            <a href="#" onclick="showPage('home')">Главная</a>
            <a href="#" onclick="showPage('all')">Каталог</a>
            <div class="auth-buttons" id="auth-section"></div>
        </nav>
    </header>

    <div class="auth-modal" id="authModal">
        <div class="auth-modal-content">
            <span class="close-auth" onclick="closeAuthModal()">&times;</span>
            <h2 id="authTitle">Вход</h2>
            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTab" onclick="switchAuthTab('login')">Вход</button>
                <button class="auth-tab" id="registerTab" onclick="switchAuthTab('register')">Регистрация</button>
            </div>
            <div class="auth-input"><input type="text" id="auth-login" placeholder="Логин (мин. 3 символа)"></div>
            <div class="auth-input"><input type="password" id="auth-password" placeholder="Пароль (мин. 4 символа)"></div>
            <button class="auth-submit" onclick="handleAuth()">Войти</button>
            <div class="auth-error" id="authError"></div>
        </div>
    </div>

    <main id="home-page">
        <div class="filters">
            <button class="filter-btn active" onclick="filterLaunchers('all', this)">Все</button>
            <button class="filter-btn" onclick="filterLaunchers('license', this)">Лицензия</button>
            <button class="filter-btn" onclick="filterLaunchers('pirate', this)">Пиратский</button>
            <button class="filter-btn" onclick="filterLaunchers('mods', this)">Для модов</button>
        </div>
        <div class="launcher-grid" id="launcher-list"></div>
    </main>

    <main id="detail-page">
        <button class="back-btn" onclick="showPage('home')"><i class="fas fa-arrow-left"></i> Назад к каталогу</button>
        
        <div class="detail-header">
            <div class="detail-logo" id="detail-logo"></div>
            <div>
                <h1 class="detail-title" id="detail-title"></h1>
                <div class="detail-rating" id="detail-rating"></div>
                <div id="detail-votes-count"></div>
            </div>
        </div>

        <div class="detail-info">
            <h3>Информация</h3>
            <p id="detail-description"></p>
            <div class="pros-cons">
                <div><h4 style="color: var(--success);">Плюсы</h4><ul class="pros" id="detail-pros"></ul></div>
                <div><h4 style="color: var(--danger);">Минусы</h4><ul class="cons" id="detail-cons"></ul></div>
            </div>
        </div>

        <div class="reviews-section">
            <h3 style="text-align: center; margin-bottom: 20px;">Оцените лаунчер</h3>
            
            <!-- Звездный рейтинг (клиентский) -->
            <div class="star-rating" id="star-rating-form">
                <i class="fas fa-star" data-value="1"></i>
                <i class="fas fa-star" data-value="2"></i>
                <i class="fas fa-star" data-value="3"></i>
                <i class="fas fa-star" data-value="4"></i>
                <i class="fas fa-star" data-value="5"></i>
            </div>
            <p id="rating-status" style="text-align: center; color: var(--warning); margin-bottom: 20px;"></p>

            <hr style="border-color: #333; margin: 20px 0;">

            <h3 style="margin-bottom: 15px;">Обсуждение</h3>
            <!-- СЮДА ВСТАВЛЯЕТСЯ JUST OPINION -->
            <div id="just-opinion-container">
                <!-- Виджет подгрузится сюда -->
                <p style="color: #888; text-align: center;">Загрузка комментариев...</p>
            </div>
        </div>
    </main>

    <footer><p>© 2026 MineReview. Отзывы работают на Just Opinion.</p></footer>

    <!-- Скрипт Just Opinion (Заменяем ключ ниже!) -->
    <script src="https://www.justopinion.online/comments.js" data-site-key="813327"></script>

    <script>
        // ================= БЕЗОПАСНЫЕ SVG ЗАГЛУШКИ ЛОГОТИПОВ =================
        const imgPlaceholder = (bg, text) => `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='${bg}'/><text x='50' y='55' font-size='30' text-anchor='middle' fill='white'>${text}</text></svg>`;
        const logos = {
            official: imgPlaceholder('green', 'M'), zlauncher: imgPlaceholder('brown', 'Z'), legacy: imgPlaceholder('black', 'L'),
            tl: imgPlaceholder('blue', 'TL'), modrinth: imgPlaceholder('green', 'M'), prism: imgPlaceholder('purple', 'P'),
            multimc: imgPlaceholder('green', 'M'), kl: imgPlaceholder('red', 'KL'), xmcl: imgPlaceholder('purple', 'X'),
            mister: imgPlaceholder('darkgreen', 'M'), xlauncher: imgPlaceholder('dark', 'X'), sk: imgPlaceholder('purple', 'SK'),
            hmcl: imgPlaceholder('brown', 'H'), flauncher: imgPlaceholder('gradient', 'FL'), nlauncher: imgPlaceholder('gray', 'N'),
            rulauncher: imgPlaceholder('darkblue', 'Ru'), vlauncher: imgPlaceholder('purple', 'V'), easylauncher: imgPlaceholder('orange', 'E')
        };

        // ================= ДАННЫЕ ЛАУНЧЕРОВ =================
        const launchersData = {
            'legacy': { name: 'Legacy Launcher', tag: 'Пиратский', category: 'pirate', logo: logos.legacy, description: 'Прямой наследник TLauncher. Безопасный, без рекламы.', pros: ['Бесплатный', 'Без рекламы'], cons: ['Устаревший интерфейс'] },
            'tl': { name: 'TL Launcher', tag: 'Пиратский', category: 'pirate', logo: logos.tl, description: 'Классический лаунчер для игры на пиратках.', pros: ['Много сборок', 'Кроссплатформенность'], cons: ['Скрытые процессы'] },
            'multimc': { name: 'MultiMC', tag: 'Для модов', category: 'license mods', logo: logos.multimc, description: 'Классика для моддинга. Полный контроль.', pros: ['Открытый код', 'Изолированные инстансы'], cons: ['Сложный интерфейс'] },
            'prism': { name: 'Prism Launcher', tag: 'Для модов', category: 'license mods', logo: logos.prism, description: 'Золотой стандарт для моддинга.', pros: ['Поддержка модпаков', 'Без рекламы'], cons: ['Сложен для новичков'] },
            'kl': { name: 'KLauncher', tag: 'Пиратский', category: 'pirate', logo: logos.kl, description: 'Пиратский лаунчер с HD-скинами. Есть риски.', pros: ['HD-скины', 'Кроссплатформенность'], cons: ['Риск вирусов'] },
            'xmcl': { name: 'XMCL', tag: 'Для модов', category: 'license mods pirate', logo: logos.xmcl, description: 'Современный UI на Electron.', pros: ['Быстрый', 'Красивый интерфейс'], cons: ['Требует ресурсов'] },
            'mister': { name: 'MisterLauncher', tag: 'Пиратский', category: 'pirate', logo: logos.mister, description: 'Часто обсуждается на форумах.', pros: ['Запуск разных версий'], cons: ['Негативные отзывы'] },
            'xlauncher': { name: 'XLauncher', tag: 'Пиратский', category: 'pirate', logo: logos.xlauncher, description: 'Популярен у школьников.', pros: ['Обход блокировок'], cons: ['Сомнительная репутация'] },
            'sk': { name: 'SKLauncher', tag: 'Пиратский', category: 'pirate mods', logo: logos.sk, description: 'Чистый лаунчер для пираток.', pros: ['Без рекламы', 'Модпаки'], cons: ['Ложные антивирусы'] },
            'hmcl': { name: 'HMCL', tag: 'Лицензия / Моды', category: 'license mods', logo: logos.hmcl, description: 'Один из мощнейших лаунчеров.', pros: ['Открытый код', 'Кроссплатформенность'], cons: ['Требует Java'] },
            'flauncher': { name: 'FLauncher', tag: 'Пиратский', category: 'pirate mods', logo: logos.flauncher, description: 'Стильный интерфейс и читы.', pros: ['Удобный', 'Моды в клик'], cons: ['Нелицензионное ПО'] },
            'nlauncher': { name: 'NLauncher', tag: 'Пиратский', category: 'pirate', logo: logos.nlauncher, description: 'Менее известный лаунчер.', pros: ['Запасной вариант'], cons: ['Мало информации'] },
            'rulauncher': { name: 'RuLauncher', tag: 'Пиратский', category: 'pirate', logo: logos.rulauncher, description: 'Русскоязычный лаунчер.', pros: ['Скины ely.by'], cons: ['Нестабильность'] },
            'vlauncher': { name: 'VLauncher', tag: 'Пиратский', category: 'pirate', logo: logos.vlauncher, description: 'Автоматическая установка Java.', pros: ['Быстрый вход'], cons: ['Молодой проект'] },
            'official': { name: 'Official Launcher', tag: 'Лицензия', category: 'license', logo: logos.official, description: 'Официальный лаунчер Mojang.', pros: ['Безопасность', 'Обновления'], cons: ['Нет модпаков'] },
            'modrinth': { name: 'Modrinth App', tag: 'Лицензия', category: 'license mods', logo: logos.modrinth, description: 'Официальный лаунчер Modrinth.', pros: ['Библиотека модов', 'Автоустановка'], cons: ['Бета-версия'] },
            'easylauncher': { name: 'EasyLauncher', tag: 'Лицензия / Моды', category: 'license mods', logo: logos.easylauncher, description: 'Современный и стильный лаунчер.', pros: ['HD-скины', 'Кроссплатформенность'], cons: ['Фейковые сайты'] },
            'zlauncher': { name: 'ZLauncher', tag: 'Пиратский', category: 'pirate', logo: logos.zlauncher, description: 'Бесплатный лаунчер со скинами.', pros: ['Скины ely.by', 'Сборки'], cons: ['Нестабильность'] }
        };

        // ================= ЛОГИКА САЙТА =================
        let currentCategory = 'all';
        let currentLauncher = null;
        let selectedRating = 0;
        let currentUser = null;
        let usersDB = [];

        // Безопасный LocalStorage
        const safeGet = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } };
        const safeSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

        // Авторизация
        function hashPassword(p) { let h = 0; for (let i = 0; i < p.length; i++) { h = ((h << 5) - h) + p.charCodeAt(i); h |= 0; } return h.toString(); }
        function getUsers() { return safeGet('mineReviewUsers') || []; }
        function saveUsers(u) { safeSet('mineReviewUsers', u); }

        function loadSession() {
            currentUser = safeGet('mineReviewCurrentUser');
            updateAuthUI();
        }

        function updateAuthUI() {
            const authSection = document.getElementById('auth-section');
            if (currentUser) {
                authSection.innerHTML = `<span class="user-name">${currentUser.login}</span><button class="logout-btn" onclick="logout()">Выйти</button>`;
            } else {
                authSection.innerHTML = `<button class="login-btn" onclick="openAuthModal()">Вход / Регистрация</button>`;
            }
        }

        function openAuthModal() { document.getElementById('authModal').classList.add('active'); document.getElementById('authError').innerText = ''; }
        function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); }
        
        function switchAuthTab(tab) {
            const lt = document.getElementById('loginTab'), rt = document.getElementById('registerTab'), title = document.getElementById('authTitle');
            if (tab === 'login') { lt.classList.add('active'); rt.classList.remove('active'); title.innerText = 'Вход'; } 
            else { rt.classList.add('active'); lt.classList.remove('active'); title.innerText = 'Регистрация'; }
        }

        function handleAuth() {
            const login = document.getElementById('auth-login').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const errorMsg = document.getElementById('authError');
            const isLoginTab = document.getElementById('loginTab').classList.contains('active');

            if (login.length < 3 || password.length < 4) { errorMsg.innerText = 'Логин (мин. 3), пароль (мин. 4)'; return; }
            const users = getUsers();

            if (isLoginTab) {
                const user = users.find(u => u.login === login && u.password === hashPassword(password));
                if (!user) { errorMsg.innerText = 'Неверный логин или пароль!'; return; }
                currentUser = user;
            } else {
                if (users.find(u => u.login === login)) { errorMsg.innerText = 'Логин уже занят!'; return; }
                const newUser = { login: login, password: hashPassword(password) };
                users.push(newUser); saveUsers(users); currentUser = newUser;
            }
            safeSet('mineReviewCurrentUser', currentUser);
            closeAuthModal(); updateAuthUI();
        }

        function logout() { safeSet('mineReviewCurrentUser', null); currentUser = null; updateAuthUI(); }

        // Рейтинг
        function getLocalRating(key) {
            const data = safeGet('ratings_' + key) || [];
            if (data.length === 0) return { avg: '0.0', count: 0 };
            const sum = data.reduce((a, b) => a + b, 0);
            return { avg: (sum / data.length).toFixed(1), count: data.length };
        }

        function addRating(key, rating) {
            let data = safeGet('ratings_' + key) || [];
            data.push(rating);
            safeSet('ratings_' + key, data);
            return getLocalRating(key);
        }

        function renderStars(r) {
            const rounded = Math.round(r); let s = '';
            for (let i = 1; i <= 5; i++) s += i <= rounded ? '★' : '☆';
            return s;
        }

        // Рендер
        function loadLaunchers() {
            const list = document.getElementById('launcher-list');
            list.innerHTML = '';
            for (const key in launchersData) {
                const data = launchersData[key];
                if (currentCategory === 'all' || data.category.includes(currentCategory)) {
                    const r = getLocalRating(key);
                    const card = document.createElement('div');
                    card.className = 'launcher-card';
                    card.onclick = () => openDetailPage(key);
                    
                    let tagClass = 'tag-pirate';
                    if (data.category.includes('license')) tagClass = 'tag-license';
                    else if (data.category.includes('pirate') && data.category.includes('mods')) tagClass = 'tag-mods';
                    else if (data.category === 'mods') tagClass = 'tag-mods';

                    card.innerHTML = `
                        <div class="card-tag ${tagClass}">${data.tag}</div>
                        <div class="logo-box"><img src="${data.logo}" alt="${data.name}"></div>
                        <h3 class="card-title">${data.name}</h3>
                        <div class="rating-block">
                            <div class="stars-display">${renderStars(r.avg)}</div>
                            <div class="avg-score">${r.avg} / 5</div>
                            <div class="total-votes">${r.count} оценок</div>
                        </div>
                        <p class="short-desc">${data.description.substring(0, 70)}...</p>
                        <button class="card-review-btn" onclick="event.stopPropagation(); openDetailPage('${key}')"><i class="fas fa-comments"></i> Смотреть отзывы</button>
                    `;
                    list.appendChild(card);
                }
            }
        }

        function openDetailPage(key) {
            currentLauncher = key;
            const data = launchersData[key];
            const r = getLocalRating(key);

            document.getElementById('detail-logo').innerHTML = `<img src="${data.logo}" alt="${data.name}">`;
            document.getElementById('detail-title').innerText = data.name;
            document.getElementById('detail-rating').innerHTML = `${renderStars(r.avg)} (${r.avg} / 5)`;
            document.getElementById('detail-votes-count').innerText = `Всего оценок: ${r.count}`;
            document.getElementById('detail-description').innerText = data.description;
            document.getElementById('detail-pros').innerHTML = data.pros.map(p => `<li><i class="fas fa-check"></i> ${p}</li>`).join('');
            document.getElementById('detail-cons').innerHTML = data.cons.map(c => `<li><i class="fas fa-times"></i> ${c}</li>`).join('');

            // Сброс звезд
            selectedRating = 0;
            resetStarRating();
            document.getElementById('rating-status').innerText = '';

            showPage('detail');
        }

        // Настройка звезд
        function setupStarRating() {
            const stars = document.querySelectorAll('#star-rating-form i');
            stars.forEach(star => {
                star.onclick = () => {
                    if (!currentUser) { openAuthModal(); return; }
                    
                    selectedRating = parseInt(star.dataset.value);
                    resetStarRating();
                    for (let i = 0; i < selectedRating; i++) stars[i].classList.add('active');
                    
                    const r = addRating(currentLauncher, selectedRating);
                    document.getElementById('rating-status').style.color = 'var(--success)';
                    document.getElementById('rating-status').innerText = `✅ Вы поставили ${selectedRating} звезд!`;
                    
                    document.getElementById('detail-rating').innerHTML = `${renderStars(r.avg)} (${r.avg} / 5)`;
                    document.getElementById('detail-votes-count').innerText = `Всего оценок: ${r.count}`;
                };
            });
        }

        function resetStarRating() {
            document.querySelectorAll('#star-rating-form i').forEach(s => s.classList.remove('active'));
        }

        // Навигация
        function showPage(page) {
            if (page === 'home') {
                document.getElementById('home-page').style.display = 'block';
                document.getElementById('detail-page').style.display = 'none';
                loadLaunchers();
            } else {
                document.getElementById('home-page').style.display = 'none';
                document.getElementById('detail-page').style.display = 'block';
            }
        }

        function filterLaunchers(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadLaunchers();
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            loadSession();
            loadLaunchers();
            setupStarRating();
        });
    </script>
</body>
</html>
